<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hajeela</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a wireframe of the site inside a frame. Choosing Sand, Sea, Summit or Snow re-themes the frame (Krillion-style). Yellow tags map blocks to Hania's ideas; the prototype bar holds the booking-rule toggles. */
:root{
  --paper:#f4f4f4; --site:#ffffff; --band:#ededed; --soft:#f8f8f8; --ink:#1f1f1f; --ink-2:#6b6b6b; --line:#dcdcdc; --line-2:#ececec;
  --fill:#e4e4e4; --fill-2:#d4d4d4; --note:#ffd84d; --note-ink:#2a2300; --focus:#2b62d9; --ok:#2f7d4f; --bad:#b03a2e; --warn:#9a6a00;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:4px; --r-s:4px; --r-m:8px; --r-l:16px; --edge:max(40px,calc((100vw - var(--maxw)) / 2)); --gut:24px; --sp1:8px; --sp2:16px; --sp3:24px; --sp4:40px; --sp5:64px; --maxw:1200px;
}
:root[data-theme="dark"]{
  --paper:#121314; --site:#18191b; --band:#202124; --soft:#1c1d20; --ink:#ececec; --ink-2:#a0a0a0; --line:#3a3b3e; --line-2:#2a2b2e;
  --fill:#2a2b2e; --fill-2:#36373b; --note:#e8c43a; --note-ink:#1d1800; --focus:#7aa2ff; --ok:#6cc08f; --bad:#ef8a7e; --warn:#e2b24c; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);padding-inline:0;padding-block:16px 0}
h1,h2,h3,h4{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:500;letter-spacing:-.03em;line-height:1.05}
h1.pg{font-size:clamp(1.9rem,4vw,2.8rem)}
h2{font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:500;letter-spacing:-.02em}
h3{font-size:1.08rem;font-weight:600;letter-spacing:-.01em}
h4{font-size:.95rem;font-weight:600}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.02em}
.eyebrow{font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}

.proto{max-width:none;margin:0 0 12px;padding-inline:max(16px,calc((100vw - var(--maxw)) / 2));display:grid;gap:10px}
.proto-top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.proto .tag{font-family:var(--mono);font-size:.75rem;color:var(--ink-2)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.rules{display:none;border:1px dashed var(--line);border-radius:var(--r-m);padding:12px;gap:10px 24px;flex-wrap:wrap;align-items:flex-start;background:var(--site)}
.rules.open{display:flex}
.rules fieldset{border:0;padding:0;margin:0;display:grid;gap:6px}
.rules legend{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--site);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--site);border-color:var(--ink)}
.frame{max-width:none;margin:0;background:var(--site);color:var(--ink);border:0;border-radius:0;overflow:hidden}
.frame main > .sec:nth-child(even){background:var(--soft)}

.nav{display:flex;align-items:center;gap:var(--sp3);padding:18px var(--edge);position:relative;background:var(--site)}
.tagline{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
@media (max-width:1000px){.tagline{display:none}}
.logo{font-family:var(--display);font-weight:600;font-size:1.2rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.logo .mark{display:none}
.links{display:flex;gap:8px;margin:0 auto;flex-wrap:wrap;align-items:center}
.links button{background:none;border:0;padding:6px 14px;border-radius:var(--r-s);cursor:pointer;font-size:.88rem;font-weight:400}
.links button:hover{background:var(--fill)}
.links button.cur{text-decoration:underline;text-underline-offset:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);border-radius:var(--r-m);min-height:44px;padding:0 20px;font-weight:500;cursor:pointer;background:var(--site);color:var(--ink);font-size:.92rem;text-decoration:none}
.btn.solid{background:var(--ink);color:var(--site)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.82rem}
.btn .ar{font-size:.8em}
.btn.ghost{background:none;border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding-inline:4px;min-height:36px;font-weight:400}
.btn:disabled{opacity:.4;cursor:not-allowed}
.menu-btn{display:inline-flex;margin-left:0;gap:10px}
.burger{display:grid;gap:4px;width:16px}.burger i{display:block;height:1.5px;background:currentColor;transition:transform .25s var(--ease-o,ease-out)}
.menu-btn[aria-expanded="true"] .burger i:first-child{transform:translateY(2.75px) rotate(45deg)}.menu-btn[aria-expanded="true"] .burger i:last-child{transform:translateY(-2.75px) rotate(-45deg)}
.links{display:none!important}
.menuov{position:fixed;inset:0;z-index:19;background:var(--site);padding:var(--sp4) max(var(--edge),calc((100vw - var(--maxw))/2 + var(--edge))) var(--sp3);display:flex;flex-direction:column;justify-content:space-between;gap:var(--sp3);overflow:auto}
.menuov[hidden]{display:none}
.mo-main{display:grid;grid-template-columns:2fr 1fr;gap:var(--sp4);align-items:start}
.mo-links{display:grid;gap:4px;justify-items:start}
.mo-links button{background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;cursor:pointer;color:var(--ink);font:500 clamp(2rem,6vw,3.6rem)/1.1 var(--display);letter-spacing:-.03em}
.mo-links button:hover,.mo-links button.cur{border-bottom-color:var(--ink)}
.mo-side{display:grid;gap:var(--sp2);align-content:start}
.mo-env{display:grid;grid-template-columns:repeat(2,1fr);padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--site)}
.mo-env{grid-template-columns:repeat(4,1fr)}
.mo-env button{border:0;background:none;color:var(--ink);font:inherit;font-size:.85rem;min-height:36px;border-radius:999px;cursor:pointer}
.mo-env button:hover{background:var(--soft)}
.mo-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--sp2);flex-wrap:wrap;border-top:1px solid var(--line);padding-top:var(--sp2)}
@media (max-width:760px){.mo-main{grid-template-columns:1fr}.mo-env{max-width:360px}}
.apponly{display:none}
@media (max-width:900px){.apponly{display:block}}
.cur-sel{font:inherit;font-size:.8rem;padding:5px 6px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--site);color:var(--ink)}
@media (max-width:900px){
  .nav .booktop{display:none}
}

.sec{padding:var(--sp5) var(--edge);display:grid;gap:var(--gut)}
@media (max-width:640px){.sec{padding:var(--sp4) var(--sp2)}.nav{padding:var(--sp2)}}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.stack{display:grid;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.box{border:1px solid var(--line-2);border-radius:var(--r-s);padding:18px;background:var(--site);display:grid;gap:10px;align-content:start;min-width:0;color:var(--ink)}
.ph{background:var(--fill);border-radius:var(--r-s);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--ink-2);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:8px;min-height:120px;max-width:100%}
.ph span{position:relative}
.lines{display:grid;gap:6px}
.lines i{display:block;height:8px;background:var(--fill-2);border-radius:var(--r-s)}
.card{cursor:pointer;text-align:left;background:none;font:inherit}
.card:hover{border-color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.75rem;font-family:var(--mono);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-family:var(--mono);font-size:.78rem;border:1.5px solid currentColor;width:max-content;max-width:100%}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}.status.neutral{color:var(--ink-2)}
.notice{border-left:3px solid var(--ink);background:var(--fill);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;font-size:.9rem;display:grid;gap:6px}
.notice.bad{border-color:var(--bad)}.notice.warn{border-color:var(--warn)}.notice.ok{border-color:var(--ok)}

.n{display:none;align-items:center;gap:6px;background:var(--note);color:var(--note-ink);font-family:var(--mono);font-size:.7rem;font-weight:500;padding:3px 8px;border-radius:var(--r-s);line-height:1.3;width:max-content;max-width:100%;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.n b{font-weight:500;background:var(--note-ink);color:var(--note);border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center;font-size:.62rem;flex:none}
.notes-on .n{display:inline-flex}
.note-p{display:none;background:var(--note);color:var(--note-ink);font-size:.8rem;padding:8px 10px;border-radius:var(--r-s);max-width:66ch}
.notes-on .note-p{display:block}

.hero{position:relative;background:var(--band)}
.hero-art{position:relative;height:clamp(460px,58vw,640px);overflow:hidden}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-copy{position:absolute;left:var(--edge);top:var(--sp4);right:var(--edge);display:grid;gap:18px;max-width:560px}
.hero-copy p.lead{max-width:44ch;color:var(--ink-2);font-size:1rem}
.hero-copy .row{gap:12px}
.hero-cap{position:absolute;right:40px;bottom:28px;display:grid;justify-items:end;text-align:right;gap:2px;max-width:320px}
.hero-cap h3{font-weight:500}
.hero-lab{position:absolute;left:40px;bottom:28px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
@media (max-width:700px){.hero-copy{left:20px;right:20px;top:28px}.hero-cap{display:none}.hero-lab{left:20px}.hero-art{height:560px}}
.chooser{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--site)}
.chooser button{background:none;border:0;border-right:1px solid var(--line);padding:28px 12px 24px;display:grid;justify-items:center;gap:10px;cursor:pointer;text-align:center;color:var(--ink)}
.chooser button:last-child{border-right:0}
.chooser button:hover{background:var(--soft)}
.chooser button.on{background:var(--ink);color:var(--site)}
.chooser button.on .wsym circle.o,.chooser button.on .wsym .g{stroke:var(--site)}
.chooser button.on .wsym .d{fill:var(--site)}
.chooser .sub{font-size:.75rem;color:var(--ink-2)}
.chooser button.on .sub{color:inherit;opacity:.75}
@media (max-width:560px){.chooser{grid-template-columns:1fr 1fr}.chooser button:nth-child(2){border-right:0}.chooser button:nth-child(-n+2){border-bottom:1px solid var(--line)}.chooser .sub{display:none}}
.wp{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--sp4);padding:var(--sp5) var(--edge);background:var(--soft);border-bottom:1px solid var(--line-2)}
@media (max-width:860px){.wp{grid-template-columns:1fr;padding:var(--sp4) var(--sp2)}}
.wp .play{grid-template-columns:150px 1fr;gap:24px}
@media (max-width:720px){.wp .play{grid-template-columns:1fr}}
.mini-trip{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink);width:100%}
.mini-trip .ph{min-height:68px}
.fam-wall{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media (max-width:860px){.fam-wall{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.fam-wall{grid-template-columns:repeat(2,1fr)}}
.polaroid{background:var(--site);border:1px solid var(--line-2);padding:8px 8px 10px;display:grid;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.polaroid:nth-child(odd){transform:rotate(-1.4deg)}.polaroid:nth-child(3n){transform:rotate(1.2deg)}
.polaroid .ph{min-height:110px;border-radius:var(--r-s)}
.polaroid span{font-size:.72rem;color:var(--ink-2);line-height:1.3}
.stats{display:flex;flex-wrap:wrap;gap:12px 40px}
.stats b{display:block;font-size:2rem;font-weight:500;letter-spacing:-.02em}
.voice{display:grid;gap:10px;padding:20px;border-left:2px solid var(--ink)}
.voice p{font-size:1.05rem;max-width:44ch}
.scene{width:100%;max-width:190px;height:380px;display:block;color:var(--ink);overflow:visible}
@media (max-width:720px){.scene{max-width:none;height:260px}}
.scene text{font:500 9px var(--body);fill:var(--ink-2);letter-spacing:.04em}
.scene text.cur{fill:var(--ink);font-weight:600}
.scene .mk{transition:transform 1.1s cubic-bezier(.6,0,.2,1)}
.scene .mk .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(2.4);opacity:0}}
.scene .bub{animation:rise 4s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:.7}to{transform:translateY(-300px);opacity:0}}
.scene .wave{animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(-20px)}}
.scene .wind{animation:wind 3.5s linear infinite}
@keyframes wind{from{transform:translateX(-40px);opacity:0}30%{opacity:.6}to{transform:translateX(200px);opacity:0}}
.scene .twinkle{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:.9}}
.scene .drift{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-12px)}}
.scene.wrong .mk .body{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.gain{font:600 11px var(--body);fill:var(--ink);animation:gain 1.6s ease-out forwards}
@keyframes gain{from{opacity:0;transform:translateY(6px)}20%{opacity:1}to{opacity:0;transform:translateY(-26px)}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important;transition:none!important}}
.gallery{display:grid;grid-template-columns:2fr 1fr;gap:var(--sp1);padding:var(--sp1) var(--edge) 0;position:relative}
.gallery > .ph{border-radius:var(--r-s)}
.gallery-side{display:grid;gap:8px}.gallery-side .ph{border-radius:var(--r-s)}
.gallery-all{position:absolute;right:20px;bottom:20px;background:var(--site)}
@media (max-width:700px){.gallery{grid-template-columns:1fr}.gallery-side{display:none}.gallery > .ph{min-height:280px!important}}
.trip-top{display:grid;grid-template-columns:1fr 340px;gap:40px;align-items:start}
@media (max-width:900px){.trip-top{grid-template-columns:1fr}}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin-top:8px}
.glance div{padding:14px 12px 14px 0;display:grid;gap:4px}
.glance b{font-weight:500;font-size:1.05rem;min-height:1.4em;display:flex;align-items:center}
.glance span{font-size:.75rem;color:var(--ink-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;cursor:pointer;font-size:.9rem;white-space:nowrap;color:var(--ink-2);margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.dayrail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.daycard{display:grid;gap:8px;scroll-snap-align:start}
.tile{border:1px solid var(--line-2);border-radius:var(--r-s);padding:16px;display:grid;gap:4px;background:var(--site);color:var(--ink);text-align:left;font:inherit}
.tile.dim{background:var(--soft)}
.tile .ico{width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:.8rem;margin-bottom:6px;flex:none}
.row-tile{display:flex;align-items:center;gap:12px;padding:10px 12px}
.row-tile .ico{margin:0}
.addon{cursor:pointer}.addon.on{border-color:var(--ink)}.addon.on .ico{background:var(--ink);color:var(--site)}
.stackbar{display:flex;height:18px;border-radius:var(--r-m);overflow:hidden;gap:2px}
.stackbar i{background:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:var(--r-s);background:var(--ink);margin-right:8px}
.tcard{background:none;border:0;padding:0;text-align:left;color:var(--ink);cursor:pointer;display:grid;gap:8px;align-content:start;min-width:0;font:inherit}
.tcard-img{position:relative}
.tcard-img .ph{min-height:260px;transition:filter .2s}
.tcard:hover .ph{filter:brightness(.95)}
.tcard-tag,.tcard-solo{position:absolute;top:10px;background:var(--site);border-radius:999px;padding:4px 10px;font-size:.72rem;display:inline-flex;gap:6px;align-items:center}
.tcard-tag{left:10px}.tcard-solo{right:10px}
.tcard-moment{font-size:.92rem;color:var(--ink-2);font-style:italic}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:8px}
.mosaic .m{position:relative;cursor:pointer;border:0;padding:0;background:none;color:var(--ink);font:inherit;text-align:left}
.mosaic .m .ph{height:100%;min-height:0!important;border-radius:var(--r-s)}
.mosaic .m span.cap{position:absolute;left:10px;bottom:10px;right:10px;background:var(--site);padding:6px 10px;border-radius:var(--r-s);font-size:.78rem}
.mosaic .m.big{grid-column:span 2;grid-row:span 2}.mosaic .m.tall{grid-row:span 2}.mosaic .m.wide{grid-column:span 2}
@media (max-width:760px){.mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:130px}.mosaic .m.big{grid-column:span 2}}
.solo{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center}
@media (max-width:860px){.solo{grid-template-columns:1fr}}
.solo-steps{display:grid;gap:0}
.solo-steps div{display:grid;grid-template-columns:36px 1fr;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.solo-steps .k{font-size:.72rem;color:var(--ink-2);padding-top:3px}
.solo-steps p{grid-column:2;font-size:.85rem;color:var(--ink-2)}
.reward{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;border:1.5px solid var(--ink);border-radius:var(--r-s);padding:18px;background:var(--site)}
@media (max-width:640px){.reward{grid-template-columns:1fr;justify-items:start}}
.stampb{width:112px;height:112px;border-radius:50%;border:1.5px dashed var(--ink);display:grid;place-items:center;align-content:center;gap:2px;text-align:center;transform:rotate(-8deg);animation:stampin .5s cubic-bezier(.3,1.6,.5,1) both}
.stampb span{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.stampb .wsym{width:44px!important;height:44px!important}
@keyframes stampin{from{transform:rotate(-8deg) scale(1.8);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

.enq .btn{border-color:#f2f2f2}.enq .btn.solid{background:#f2f2f2;color:#1a1a1a}
/* itinerary: numbered day by day */
.dayrail{display:grid!important;grid-auto-flow:row!important;grid-template-columns:1fr!important;gap:0!important;overflow:visible!important;background:#1f2024;color:#f2f2f2;border-radius:var(--r-m);padding:var(--sp3) var(--sp4)}
.daycard{display:grid!important;grid-template-columns:88px minmax(0,1fr) minmax(0,1fr);grid-template-areas:"n t i" "n p i";column-gap:var(--sp3);row-gap:8px;align-items:start;width:auto!important;min-width:0!important;padding:var(--sp3) 0;border-top:1px solid #3a3b40;background:none!important;border-inline:0;border-bottom:0;transition:background .3s}

.phil{--site:#26272b;--band:#26272b;--soft:#26272b;--ink:#f2f2f2;--ink-2:#b5b5b5;--line:#3d3e43;--line-2:#3d3e43;background:#1f2024;color:var(--ink);padding-block:var(--sp5)}

/* scroll cue + motion */
.scrollcue{position:absolute;left:50%;bottom:60px;translate:-50% 0;z-index:3;display:grid;justify-items:center;gap:8px;border:0;background:none;cursor:pointer;color:var(--ink);font:inherit;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase}

/* moments wall: scattered snapshots that straighten on hover; swipe on phones */
.memwall .mem{background:var(--site);padding:8px 8px 30px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.12);transition:transform .45s var(--ease-o,ease-out),box-shadow .45s;rotate:var(--rot,0deg)}

/* ===== motion system ===== */
:root{--mo-e:cubic-bezier(.16,.84,.2,1);--film:cubic-bezier(.16,.84,.2,1);--snap:cubic-bezier(.34,1.56,.64,1)}
/* TWO TEMPOS. Film: slow, long ease-out. Used for headlines, pictures, trip-card doors, descriptions.
   Snap: quick, a little springy. Used for labels, dates, buttons, pills, symbols, list rows. */
#mprog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0);z-index:80;pointer-events:none}
/* headlines, line by line */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.16em .08em;margin:-.16em -.08em}
.wi{display:inline-block}
.mo-h .wi{transform:translateY(118%)}
.mo-h.in .wi{transform:none;transition:transform var(--hd,1.1s) var(--film) calc(var(--d,0s) + var(--l,0) * var(--hl,.1s))}
/* supporting text, labels, calls to action */
.mo{opacity:0}
.mo-s{transform:translateY(8px)}
.mo-s.in{opacity:1;transform:none;transition:opacity .3s ease var(--d,0s),transform .45s var(--snap) var(--d,0s)}
.mo-f{transform:translateY(28px)}
.mo-f.in{opacity:1;transform:none;transition:opacity 1.3s var(--film) var(--d,0s),transform 1.5s var(--film) var(--d,0s)}
.mo-p{transform:scale(.86) translateY(10px)}
.mo-p.in{opacity:1;transform:none;transition:opacity .25s ease var(--d,0s),transform .6s var(--snap) var(--d,0s)}
.mo-pop:not(.in){opacity:0;scale:.3}
.mo-pop.in{animation:mo-pop .6s var(--snap) var(--d,0s) backwards}
@keyframes mo-pop{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
.mo-rows:not(.in) .al-row{opacity:0!important}
.mo-rows.in .al-row{animation:mo-row .5s var(--snap) var(--d,0s) backwards}
@keyframes mo-row{from{opacity:0;transform:translateY(16px)}}
@keyframes mo-stamp{from{opacity:0;transform:scale(.5) rotate(-9deg)}}
@keyframes mo-snap{from{opacity:0;transform:translateY(12px) scale(.94)}}
/* memories: polaroids are tossed down, quick and playful */
.memed .mem.rvl{opacity:0;translate:0 56px;scale:.82;transition:opacity .35s ease,translate .8s var(--snap),scale .8s var(--snap)}
.memed .mem.rvl.in{opacity:1;translate:0 0;scale:1}

.mo-img:not(.in){clip-path:inset(100% 0 0 0)}
.mo-img.in{animation:mo-open 1.2s var(--mo-e) var(--d,0s) backwards}
.mo-img.in .ph{animation:mo-settle 1.8s var(--mo-e) var(--d,0s) backwards}
@keyframes mo-open{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes mo-settle{from{transform:scale(1.2)}}
@keyframes mo-up{from{opacity:0;transform:translateY(20px)}}
/* trip cards: a door opening from the middle */
.ls.mo-card:not(.in){clip-path:inset(0 50% 0 50% round 14px)}
.ls.mo-card.in{animation:mo-door 1.25s cubic-bezier(.7,0,.15,1) var(--d,0s) backwards}

 'desert-night':{w:'sand',b:[['intro',"The desert drops fast after sunset. A hot afternoon and a cold night live in the same day."],

  ['img','The camp after dark, one fire and a lot of sky'],
  ['sec','01','Layers beat one big coat',"Three thin layers you can add or drop are warmer and easier than one heavy jacket. Wool or fleece next to the skin, a windproof on top."],
  ['hj',"Bring one more layer than you think. We have blankets and a fire, but nobody ever said no to a spare hat.",'sand'],

 'pocket-money':{w:'sand',b:[['intro',"Everything important is included. Pocket money is for the small things: a tea, a souvenir, a tip."],
  ['sec','01','Day trips',"Bring 300 to 500 EGP. A drink, something sweet and a little extra. Most people spend less than they bring."],

  ['fact','Cash',"Most places off the main road do not take cards. Small notes are easier than large ones."],

function artMods(id,r){const A=ART[id]||{w:'sand',b:[['intro',r.s],['sec','01','What you need to know',"Placeholder: the story goes here, in a short, friendly voice."],['tip','Placeholder tip: one small thing that makes a big difference.'],['faq',[['A question people often ask?','A short, honest answer.']]]]};
 return A}
function artBlock(b,id,i,w){switch(b[0]){
 case 'intro':return `<div class="ab"><p class="art-lead">${b[1]}</p></div>`;
 case 'sec':return `<div class="ab ab-sec"><span class="mono art-n">${b[1]}</span><div class="stack"><h2>${b[2]}</h2><p>${b[3]}</p></div></div>`;
 case 'tip':return `<div class="ab ab-tip"><span class="mono">Tip</span><p>${b[1]}</p></div>`;
 case 'check':return `<div class="ab">${pkGroup('a-'+id+i,b[1],b[2],'a:'+id+i+':',`<span class="pk-stamp">${sym(w,28)}</span><b>You're packed.</b>`)}</div>`;
 case 'steps':return `<div class="ab ab-steps"><div class="stack"><span class="mono">Step by step</span><h2>${b[1]}</h2></div><ol>${b[2].map((x,k)=>`<li><span class="mono art-n">${String(k+1).padStart(2,'0')}</span><div class="stack"><h3>${x[0]}</h3><p>${x[1]}</p></div></li>`).join('')}</ol></div>`;
 case 'img':return `<div class="ab ab-wide"><div class="art-img mo-keep">${ph('Photo · '+b[1],380)}</div><p class="small muted art-cap">${b[1]}</p></div>`;
 case 'quote':return `<div class="ab ab-wide ab-quote"><p class="art-q">“${b[1]}”</p><span class="mono">${b[2]}</span></div>`;
 case 'fact':return `<div class="ab ab-fact"><span class="art-big">${b[1]}</span><p>${b[2]}</p></div>`;
 case 'hj':return `<div class="ab ab-hj"><span class="pk-stamp">${sym(w,30)}</span><div class="stack"><span class="mono">A Hajeela note</span><p>${b[1]}</p><button class="btn ghost sm" data-go="trips-${b[2]}">See ${WORLDS[b[2]].name.toLowerCase()} trips</button></div></div>`;
 case 'faq':return `<div class="ab ab-faq"><div class="stack"><span class="mono">Good to know</span><h2>Questions we get asked</h2></div>${b[1].map(x=>`<details><summary><span>${x[0]}</span><i aria-hidden="true"></i></summary><p>${x[1]}</p></details>`).join('')}</div>`;
 default:return ''}}
V.read=(id)=>{const r=READS.find(x=>x.id===id)||READS[0],A=artMods(r.id,r),rel=READS.filter(x=>x.id!==r.id).slice(0,3);return `
<section class="sec art"><div class="art-top"><button class="btn ghost sm" data-go="reads">← Travel journal</button></div>
<header class="art-head"><div class="stack"><span class="eyebrow">${r.tag}</span><h1 class="pg art-h1">${r.t}</h1><span class="mono muted">${r.mins} min read · by the Hajeela team</span></div>
<div class="art-hero mo-keep">${ph('Header illustration',420)}</div></header>
<div class="art-body">${A.b.map((b,i)=>artBlock(b,r.id,i,A.w)).join('')}</div>
<div class="art-rel"><div class="stack"><span class="mono">Keep reading</span><h2>More from the journal</h2></div><div class="rel-grid">${rel.map(x=>`${jCard({go:'read-'+x.id,t:x.t,tag:x.tag,mins:x.mins})}`).join('')}</div></div>
</section>`};

  <div class="lane" style="border-style:dashed"><span class="eyebrow">Discover Hajeela</span><div class="lane-steps">${[['Homepage','home'],['Explore','explore'],['Destinations','destinations'],['Experiences','experiences'],['All trips','trips']].map(x=>`<button class="stepbox" data-go="${x[1]}"><b>${x[0]}</b></button>`).join('')}</div></div>
  <div class="grid g2">
    <div class="lane"><span class="eyebrow">Path 01 · Book a trip · ready-made</span><div class="lane-steps" style="flex-direction:column">${[['1','Choose a trip','Trip detail page','trip-ras-mohamed'],['2','Select departure','Date + number of travellers; full dates disabled','book-ras-mohamed'],['3','Traveller details','Lead traveller + each participant, one step, no account',''],['4','Booking summary','Itemised price, payment terms, cancellation policy',''],['5','Pay online','Full or deposit · '+rl('pay'),''],['6','Confirmation','Reference, status, next steps, email + WhatsApp','']].map(x=>`<button class="stepbox" ${x[3]?`data-go="${x[3]}"`:'data-book="ras-mohamed"'}><span class="k">${x[0]}</span><b>${x[1]}</b><span class="muted">${x[2]}</span></button>`).join('')}

    <div class="lane"><span class="eyebrow">Path 02 · Create your trip · private & custom</span><div class="lane-steps" style="flex-direction:column">${[['1','Choose experience type','Friends, private, family, celebration, honeymoon, different','create'],['2','Share preferences','Where, what, when, who, budget, special requirements','create-form'],['3','Submit enquiry','Contact details + what happens next','create-form'],['4','Discuss proposal',rl('prop'),'proposal'],['5','Approve details','Options, changes, approve','proposal'],['6','Pay and confirm','Same checkout components as Path 01','proposal']].map(x=>`<button class="stepbox" data-go="${x[3]}"><span class="k">${x[0]}</span><b>${x[1]}</b><span class="muted">${x[2]}</span></button>`).join('')}</div></div>
  </div>
  <div class="shared"><span class="eyebrow" style="color:inherit;opacity:.8">Your Hajeela experience · shared by both paths</span><div class="lane-steps">${['Confirmation','Preparation','Trip','Memories','Return'].map(x=>`<span>${x}</span>`).join('')}</div><span class="small" style="opacity:.85">Guest booking + Manage your booking now. The app takes over in Release 3.</span></div>

<p class="muted small">Also handled: a search or filter with no matching trips (shows the closest trips, a short form, a person to talk to, and later an AI chat; <button class="btn ghost sm" data-nodemo="1">see it</button>), fully booked departures (waitlist), duplicate submissions (no second charge, shows the existing reference), changes to traveller details and cancellation requests (from Manage your booking), and bookings that need manual review.</p></section>

V.states=()=>{const S=[
 ['neutral','Pending',"Your request is with Hajeela. It isn't confirmed yet. We'll update you once we've checked availability, usually within 24 hours. Nothing has been charged.",'See other trips','trips'],
 ['warn','Awaiting payment',"Your payment isn't complete. Pick up where you left off. Your places are held for a short time, as set by the policy.",'Continue payment','book-ras-mohamed'],
 ['ok','Confirmed',"You're going. Your booking and payment are complete. Check your email for what happens next.",'View confirmation','manage'],
 ['bad','Payment failed',"Your payment didn't go through, and you haven't been charged. Try again. Your traveller details are saved.",'Retry payment','book-ras-mohamed'],
 ['bad','Cancelled','This booking has been cancelled. Any refund, and when it arrives, follows the cancellation policy.','See trips','trips'],
 ['neutral','Refunded','Your refund has been sent. We show the amount, the currency and the status from the payment provider.','See trips','trips'],
 ['warn','Fully booked departure',"This date is full. Choose another date, join the waitlist, or ask us about alternatives.",'Choose another departure','trip-ras-mohamed'],
 ['warn','Duplicate submission',"We already have this booking and it's being processed. You don't need to book again, and you won't be charged twice.",'Review booking summary','manage'],
 ['neutral','Change or cancellation request',"A request isn't a change yet. Hajeela confirms the outcome. Cancellation and refund are shown as separate statuses.",'Review traveller details','manage']];
 return `<section class="sec"><div class="stack"><h1 class="pg">Clear status. A clear next step.</h1><p class="muted" style="max-width:66ch">These are alternative states, not one booking's history. A submitted request is never labelled as confirmed.</p></div>
 <div class="grid g3">${S.map((x,i)=>`<div class="box" style="background:var(--soft);padding:22px;gap:14px;grid-template-rows:auto auto 1fr auto"><span class="eyebrow">Status / ${String(i+1).padStart(2,'0')}</span><div class="stack" style="gap:8px"><h3 style="font-size:1.25rem;font-weight:500">${x[1]}</h3><span class="status ${x[0]}">${x[1]}</span></div><p class="small">${x[2]}</p><button class="btn sm" style="justify-content:flex-start;background:var(--site)" data-go="${x[4]}">${x[3]}</button></div>`).join('')}</div>
 <p class="small muted">Guest access: a secure link in the confirmation email. No forced account creation. The same trip and booking records carry over to the app later.</p></section>`};

function initMotion(){
  if(matchMedia('(max-width:760px)').matches||MQ||matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
  const view=document.getElementById('view');if(!view)return;
  const SK='.enq,.stage,.takeover,.hero,.menuov,.foot,.proto';
  const ok=el=>!el.closest(SK);
  const roots=[];
  const done=(els,ms,cls)=>setTimeout(()=>els.forEach(e=>e.classList.remove(...cls)),ms);
  /* headlines: words rise out of a mask, line by line */
  function splitWords(h){
    if(h.dataset.sp)return +h.dataset.sp;
    h.setAttribute('aria-label',h.textContent.replace(/\s+/g,' ').trim());
    const walk=n=>[...n.childNodes].forEach(c=>{
      if(c.nodeType===3){const f=document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;
          if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(' '));return}
          const w=document.createElement('span');w.className='w';w.setAttribute('aria-hidden','true');
          const i=document.createElement('span');i.className='wi';i.textContent=t;w.appendChild(i);f.appendChild(w)});
        c.replaceWith(f)}
      else if(c.nodeType===1&&c.tagName!=='BR')walk(c)});
    walk(h);
    let top=null,l=-1;h.querySelectorAll('.w').forEach(w=>{const t=w.offsetTop;if(top===null||Math.abs(t-top)>4){l++;top=t}w.style.setProperty('--l',l)});
    h.dataset.sp=l+1;return l+1}
  /* text groups: label, then headline, then description, then the call to action */
  view.querySelectorAll('.sec-head,.sec>.stack,.memed-head,.xmap-sec>.stack,.dhead>.stack,.art-head>.stack,.ab,.art-rel>.stack').forEach(g=>{
    if(!ok(g))return;
    const all=[...g.querySelectorAll('h1,h2,h3,.eyebrow,.mono,p,.btn,.chip,.xsub,.favE-q,.ostory-q,.art-q,.art-big,.lead')].filter(e=>!e.closest('.n,.note,.idea'));
    const kids=all.filter(e=>!all.some(o=>o!==e&&o.contains(e)));
    if(!kids.length)return;
    let lines=1;const heads=kids.filter(k=>/^H[12]$/.test(k.tagName)||k.matches('.favE-q,.ostory-q,.art-q'));
    heads.forEach(h=>{lines=Math.max(lines,splitWords(h))});
    const big=heads.some(h=>h.matches('h1,.favE-q,.ostory-q,.art-q')),step=big?.16:.1,base=.1,hEnd=base+lines*step+(big?.5:.2);
    kids.forEach(k=>{
      let d;
      if(heads.includes(k)){const b=k.matches('h1,.favE-q,.ostory-q,.art-q');k.classList.add('mo-h');k.style.setProperty('--hd',b?'1.6s':'1.1s');k.style.setProperty('--hl',(b?.16:.1)+'s');d=base}
      else if(k.matches('.eyebrow,.mono')){k.classList.add('mo','mo-s');d=.02}          /* quick */
      else if(k.matches('.btn,.chip')){k.classList.add('mo','mo-p');d=hEnd+.3}           /* quick, springy */
      else{k.classList.add('mo','mo-f');d=hEnd-.25}                                      /* slow */
      k.style.setProperty('--d',d.toFixed(2)+'s')});
    roots.push({el:g,kids,type:'g',ms:(hEnd+2.2)*1000})});
  /* trip cards open like a door: the picture first, then title, the moment, the details */
  const rowIdx=(el,sel)=>{const sib=[...el.parentElement.children].filter(c=>c.matches(sel));return Math.min(sib.indexOf(el),5)};
  [].forEach.call([],c=>{if(!ok(c))return;c.classList.add('mo-card');c.style.setProperty('--d',(rowIdx(c,'.ls')*.13).toFixed(2)+'s');roots.push({el:c,obs:c.parentElement,type:'c',ms:3600})});
  [].forEach.call([],c=>{if(!ok(c))return;c.classList.add('mo-card','mo-tc');c.style.setProperty('--d',(rowIdx(c,'.tcard')*.12).toFixed(2)+'s');roots.push({el:c,type:'c',ms:3200})});
  /* pictures open from the bottom, the photo settles inside its frame */
  view.querySelectorAll('.ostory-imgs>div,.favE-imgs>div,.favbig-imgs>div,.xmos .m,.mosaic .m,.xplace,.al-img,.pk-img,.art-hero,.art-img,.rel-img').forEach(c=>{if(!ok(c)||c.closest('.mo-card'))return;c.classList.add('mo-img');c.style.setProperty('--d',(rowIdx(c,'*')*.1).toFixed(2)+'s');roots.push({el:c,obs:c.parentElement,type:'i',ms:3000})});
  /* the rest keeps a quiet rise, staggered */
  view.querySelectorAll('.cpath,.door2,.mem,.box').forEach((el,i)=>{if(!ok(el)||el.closest('.mo-card'))return;el.classList.add('rvl');el.style.transitionDelay=(Math.min(i%4,3)*.08)+'s';roots.push({el,type:'r',ms:0})});
  view.querySelectorAll('.mpin,.mbadge').forEach((el,i)=>{el.classList.add('mo-pop');el.style.setProperty('--d',(i*.11).toFixed(2)+'s');roots.push({el,type:'p',ms:2000})});
  view.querySelectorAll('.al-rows,.pk-list').forEach(el=>{if(!ok(el))return;el.classList.add('mo-rows');[...el.children].forEach((r,i)=>r.style.setProperty('--d',(Math.min(i,10)*.05).toFixed(2)+'s'));roots.push({el,type:'w',ms:2000})});
  /* the clipped elements cannot be observed themselves, so their parent is the trigger */
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!(e.isIntersecting||e.boundingClientRect.top<0))return;
    io.unobserve(e.target);
    roots.filter(x=>(x.obs||x.el)===e.target).forEach(r=>{
      r.el.classList.add('in');
      if(r.type==='g'){r.kids.forEach(k=>k.classList.add('in'));done([r.el,...r.kids],r.ms,['mo','mo-s','mo-f','mo-p','mo-h','in'])}
      else if(r.type==='c')done([r.el],r.ms,['mo-card','mo-tc','in']);
      else if(r.type==='i')done([r.el],r.ms,['mo-img','in']);
      else if(r.type==='p')done([r.el],r.ms,['mo-pop','in']);
      else if(r.type==='w')done([r.el],r.ms,['mo-rows','in'])})
  }),{threshold:.1,rootMargin:'0px 0px -8% 0px'});
  new Set(roots.map(r=>r.obs||r.el)).forEach(el=>io.observe(el));

document.addEventListener('pointermove',e=>{const el=document.querySelector('.stage');if(!el||e.pointerType==='touch')return;const r=el.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom)return;el.style.setProperty('--px',((e.clientX-r.left)/r.width*2-1).toFixed(3));el.style.setProperty('--py',((e.clientY-r.top)/r.height*2-1).toFixed(3))},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.play&&state.play.imm){state.play.imm=false;stageSync();return}
  if((e.target.id==='q0'||e.target.id==='q1')&&e.key==='Enter'){state.f.q=e.target.value;go('trips');return}
  if($('#topCard')&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))fling(e.key==='ArrowRight');
});
$('#notesBtn').addEventListener('click',e=>{const on=frame.classList.toggle('notes-on');e.currentTarget.setAttribute('aria-pressed',on)});
$('#rulesBtn').addEventListener('click',e=>{const o=$('#rules').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o);e.currentTarget.classList.toggle('on',o)});
function closeMenu(){const m=$('#menuov');if(m&&!m.hidden&&!m.classList.contains('closing')){m.classList.add('closing');$('#menuBtn').setAttribute('aria-expanded','false');setTimeout(()=>{m.hidden=true;m.classList.remove('closing')},220)}}
$('#menuBtn').addEventListener('click',e=>{const m=$('#menuov'),b=e.currentTarget;if(m.hidden){b.setAttribute('aria-expanded','true');setTimeout(()=>{m.hidden=false;m.style.top='0px'},200)}else closeMenu()});
$('#menuClose').addEventListener('click',closeMenu);
$('#menuov').addEventListener('click',e=>{if(e.target.closest('button[data-go],button[data-pick]'))setTimeout(closeMenu,0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});

function keepInputs(fn){const v={};view.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{v[e.id]=e.type==='checkbox'?e.checked:e.value});fn();Object.keys(v).forEach(id=>{const e=document.getElementById(id);if(!e)return;if(e.type==='checkbox')e.checked=v[id];else e.value=v[id]})}
let busy=false;
function fling(like){
  if(busy)return;const card=$('#topCard');if(!card)return;busy=true;
  card.style.transform=`translateX(${like?520:-520}px) rotate(${like?24:-24}deg)`;
  card.querySelector(like?'.yes':'.no').style.opacity=1;
  const m=state.match;if(like)m.likes.push(CARDS[m.i].w);m.i++;
  setTimeout(()=>{busy=false;rerender()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:280);
}
function bindSwipe(){
  const card=$('#topCard');let sx=0,dx=0,down=false;
  card.addEventListener('pointerdown',e=>{down=true;sx=e.clientX;dx=0;card.classList.add('drag');card.setPointerCapture(e.pointerId)});
  card.addEventListener('pointermove',e=>{if(!down)return;dx=e.clientX-sx;card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    card.querySelector('.yes').style.opacity=Math.max(0,dx/120);card.querySelector('.no').style.opacity=Math.max(0,-dx/120)});
  const up=()=>{if(!down)return;down=false;card.classList.remove('drag');
    if(Math.abs(dx)>100)fling(dx>0);else{card.style.transform='';card.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}};
  card.addEventListener('pointerup',up);card.addEventListener('pointercancel',up);
}
renderRules();
route();
})();

/* swipe between phases of the create form */
(function(){let sx=0,sy=0,on=false;const v=document.getElementById('view');
v.addEventListener('touchstart',e=>{const t=e.target;on=!!t.closest('.enq-pane')&&!t.closest('input,textarea,select');const p=e.touches[0];sx=p.clientX;sy=p.clientY},{passive:true});
v.addEventListener('touchend',e=>{if(!on)return;on=false;const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6)return;
const b=document.querySelector(dx<0?'.enq-nav [data-nav="1"]:not(:disabled)':'.enq-nav [data-nav="-1"]');if(b)b.click()},{passive:true})})();

/* light / dark switch: light by default, one theme for the whole site */
(function(){const R=document.documentElement;let t='light';try{t=localStorage.getItem('hj-theme')||'light'}catch(e){}
R.dataset.theme=t==='dark'?'dark':'light';
document.getElementById('themeSw').addEventListener('click',()=>{const n=R.dataset.theme==='dark'?'light':'dark';R.dataset.theme=n;try{localStorage.setItem('hj-theme',n)}catch(e){}});})();

/* experiences list: hover or focus picks the image */
function alOn(L,r){L.dataset.a=r.dataset.i;L.querySelectorAll('.al-row').forEach(x=>x.classList.toggle('on',x===r));L.querySelectorAll('.al-pane').forEach((p,i)=>p.classList.toggle('on',i===+r.dataset.i))}
document.addEventListener('mouseover',e=>{const r=e.target.closest&&e.target.closest('.al-row');if(!r)return;alOn(r.closest('.alist'),r)});
document.addEventListener('focusin',e=>{const r=e.target.closest&&e.target.closest('.al-row');if(!r)return;alOn(r.closest('.alist'),r)});

/* seamless scroll: scroll-linked drift for headlines, cards and the photos inside them */
(function(){
if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const SKIP='.enq,.stage,.hero,.memed,.menuov,.hud,header,.foot,.proto,.ls .ls-img';
let items=[],ticking=false,rafOn=false;
function collect(){items=[];const view=document.getElementById('view')||document.body;
 const add=(el,kind,amp)=>{if(el.closest(SKIP)&&!(kind==='img'))return;if(el.closest('.enq,.stage,.hero,.memed,.menuov,.foot'))return;el.classList.add(kind==='img'?'px-img':'px');items.push({el,kind,amp,v:0})};
 view.querySelectorAll('h1,h2,.favE-q,.ostory-q,.xsub,.xh,.eyebrow').forEach(el=>add(el,'text',-22));
 
 
 update(true)}
function update(force){const vh=innerHeight;items.forEach(it=>{const r=it.el.getBoundingClientRect();
  if(r.bottom<-200||r.top>vh+200){if(force)it.el.style.setProperty('--px','0');return}
  const c=(r.top+r.height/2-vh/2)/vh;let t=Math.max(-1.2,Math.min(1.2,c))*(it.kind==='img'?-it.amp:it.amp)*-1;
  it.t=t;if(force){it.v=t;it.el.style.setProperty('--px',t.toFixed(1))}})}
function frame(){rafOn=false;let moving=false;const vh=innerHeight;
 items.forEach(it=>{const r=it.el.getBoundingClientRect();if(r.bottom<-200||r.top>vh+200)return;
  const c=(r.top+r.height/2-vh/2)/vh;const t=Math.max(-1.2,Math.min(1.2,c))*it.amp;
  it.v+=(t-it.v)*.14;if(Math.abs(t-it.v)>.05)moving=true;it.el.style.setProperty('--px',it.v.toFixed(2))});
 if(moving&&!rafOn){rafOn=true;requestAnimationFrame(frame)}}
addEventListener('scroll',()=>{if(!rafOn){rafOn=true;requestAnimationFrame(frame)}},{passive:true});
addEventListener('resize',()=>{collect()});window.__px=collect;
const v=document.getElementById('view');if(v)new MutationObserver(()=>{clearTimeout(collect.t);collect.t=setTimeout(collect,120)}).observe(v,{childList:true});
collect();})();

/* trip detail: highlight the section you are reading in the sticky switcher */
(function(){let t=false;function spy(){t=false;const nav=document.querySelector('.tx-nav');if(!nav)return;const secs=[...document.querySelectorAll('.tx-s')];if(!secs.length)return;const y=(document.querySelector('.nav')?.offsetHeight||72)+90;let cur=secs[0];secs.forEach(e=>{if(e.getBoundingClientRect().top<=y)cur=e});nav.querySelectorAll('.tx-nav-in button').forEach(b=>{const on=b.dataset.scroll===cur.id;b.classList.toggle('on',on);if(on&&nav.scrollWidth>0){const r=b.parentElement;if(r.scrollWidth>r.clientWidth){const l=b.offsetLeft-r.clientWidth/2+b.offsetWidth/2;r.scrollTo?.({left:l})}}})}
addEventListener('scroll',()=>{if(!t){t=true;requestAnimationFrame(spy)}},{passive:true});})();
</script>
